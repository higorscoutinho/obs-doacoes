<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay de doações</title>
<style>
  :root{--ub:19.2px;--u:var(--ub)}
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body.preview{background:linear-gradient(135deg,#2b3a67 0%,#1b1f3b 45%,#3a1f4a 100%)}
  .pvlabel{display:none}
  body.preview .pvlabel{display:block;position:absolute;top:calc(var(--u)*.6);left:50%;transform:translateX(-50%);
    font-size:calc(var(--u)*.9);color:#ffffff55;letter-spacing:.15em}

  /* ---------- Alerta ---------- */
  .alert{--u:calc(var(--ub)*var(--as,1));position:absolute;left:min(var(--ax,3%),calc(100% - var(--u)*36 - 1%));top:var(--ay,12%);width:calc(var(--u)*36);box-sizing:border-box;
    padding:calc(var(--u)*1.2) calc(var(--u)*1.8);border-radius:calc(var(--u)*1.3);
    background:linear-gradient(135deg,var(--a1,#ffb703),var(--a2,#fb5607));color:var(--atx,#1a0f00);
    box-shadow:0 12px 40px #000a,0 0 0 3px #ffffff55 inset;
    transform:translateX(-140%);opacity:0;pointer-events:none}
  .alert.in{animation:slidein .45s cubic-bezier(.2,1.3,.4,1) forwards}
  .alert.out{animation:slideout .35s ease-in forwards}
  @keyframes slidein{to{transform:translateX(0);opacity:1}}
  @keyframes slideout{from{transform:translateX(0);opacity:1}to{transform:translateX(-140%);opacity:0}}
  .alert .who{font-size:calc(var(--u)*1.5);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .alert .amt{font-size:calc(var(--u)*3.4);font-weight:900;line-height:1.05;margin-top:.1em}
  .alert .msg{font-size:calc(var(--u)*1);opacity:.75;margin-top:.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- Ranking ---------- */
  .rank{--u:calc(var(--ub)*var(--rs,1));position:absolute;left:min(var(--rx,69%),calc(100% - var(--u)*28 - 1%));top:var(--ry,24%);width:calc(var(--u)*28);box-sizing:border-box;
    padding:calc(var(--u)*.9) calc(var(--u)*1.1);border-radius:calc(var(--u)*1.1);
    background:var(--rbgc,rgba(0,0,0,.7));color:var(--rtx,#fff);opacity:0;transition:opacity .4s}
  .rank h3{margin:0 0 calc(var(--u)*.6);font-size:calc(var(--u)*.95);letter-spacing:.12em;
    text-transform:uppercase;color:var(--rac,#ffb703)}
  .rank .list{position:relative}
  .ri{position:absolute;left:0;right:0;top:0;box-sizing:border-box;display:flex;align-items:center;
    gap:calc(var(--u)*.6);padding:0 calc(var(--u)*.7);border-radius:calc(var(--u)*.7);
    background:rgba(255,255,255,.08);font-size:calc(var(--u)*1.25);
    transition:transform .6s cubic-bezier(.3,1.2,.4,1),background .4s,opacity .4s}
  .ri.flash{background:var(--rflash,rgba(255,183,3,.35))}
  .ri .pos{width:1.6em;font-weight:900;color:var(--rac,#ffb703)}
  .ri .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .ri .vl{font-weight:800;font-variant-numeric:tabular-nums}
  .ri .vs{font-size:1.05em;line-height:1}
  /* Empate: embate (⚔️) com aviso pulsante em vermelho */
  .ri.tie{background:rgba(255,70,70,.16);animation:tierow .9s ease-in-out infinite alternate}
  .alert.tiealert{--a1:rgba(214,40,40,.96);--a2:rgba(255,107,107,.96);--atx:#fff}
  /* Rodada de desempate: lista inteira destacada em dourado até o painel encerrar a rodada */
  .rank.round{box-shadow:0 0 0 calc(var(--u)*.2) #ffd60a,0 0 calc(var(--u)*2.2) rgba(255,214,10,.6);animation:roundglow 1.1s ease-in-out infinite alternate}
  @keyframes roundglow{from{box-shadow:0 0 0 calc(var(--u)*.2) rgba(255,214,10,.55),0 0 calc(var(--u)*1.2) rgba(255,214,10,.25)}to{box-shadow:0 0 0 calc(var(--u)*.2) #ffd60a,0 0 calc(var(--u)*2.6) rgba(255,214,10,.8)}}
  .rank.round .ri{background:rgba(255,214,10,.14)}
  .rank.round .ri.tie{background:rgba(255,70,70,.2)}
  .roundpill{display:none;padding:.15em .7em;border-radius:99px;background:#ffd60a;color:#2a2100;font-size:.9em;font-weight:800;
    letter-spacing:.08em;white-space:nowrap;animation:tiepill .8s ease-in-out infinite alternate}
  .rank.round .roundpill{display:inline-block}
  .rank.round.hastie .tiepill,.rank.round .tiepill{display:none}
  @keyframes tierow{from{box-shadow:inset 0 0 0 calc(var(--u)*.14) rgba(255,70,70,.30)}to{box-shadow:inset 0 0 0 calc(var(--u)*.14) rgba(255,70,70,.95)}}
  .rank h3{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*.6)}
  .tiepill{display:none;padding:.15em .7em;border-radius:99px;background:#e63232;color:#fff;font-size:.9em;
    letter-spacing:.08em;white-space:nowrap;animation:tiepill .8s ease-in-out infinite alternate}
  .rank.hastie .tiepill{display:inline-block}
  @keyframes tiepill{from{transform:scale(1);opacity:.85}to{transform:scale(1.1);opacity:1}}

  .spark{position:absolute;width:calc(var(--u)*.55);height:calc(var(--u)*.55);border-radius:50%;
    pointer-events:none;animation:fly 1.1s ease-out forwards}
  @keyframes fly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
  #aviso{position:absolute;left:1%;bottom:1%;font-size:calc(var(--u)*1);color:#fff;background:#b00020cc;
    padding:.4em .8em;border-radius:8px;display:none}
</style>
</head>
<body>
<div class="pvlabel">PRÉVIA</div>
<div class="alert" id="alert">
  <div class="who" id="aWho"></div>
  <div class="amt" id="aAmt"></div>
  <div class="msg" id="aMsg"></div>
</div>
<div class="rank" id="rank">
  <h3><span id="rTitle"></span><span class="tiepill" id="tiePill">⚔️ EMPATE</span><span class="roundpill" id="roundPill">⚔️ DESEMPATE</span></h3>
  <div class="list" id="rlist"></div>
</div>
<div id="aviso"></div>

<script src="config.js"></script>
<script src="comum.js"></script>
<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var preview = /[?&]preview=1/.test(location.search);
  if (preview) document.body.classList.add('preview');

  var cfg = DOA.merge({}), donors = {}, rows = {}, queue = [];
  var showing = false, pinned = false, ctx = null;
  var key = function(n){ return String(n).trim().toLowerCase(); };

  function unit(){
    var u = window.innerWidth / 100;
    document.documentElement.style.setProperty('--ub', u + 'px');
    return u;
  }

  function applyCfg(c){
    cfg = DOA.merge(c);
    var s = document.documentElement.style, a = cfg.aOp / 100;
    s.setProperty('--a1', DOA.hexA(cfg.aC1, a));
    s.setProperty('--a2', DOA.hexA(cfg.aC2, a));
    s.setProperty('--atx', cfg.aTx);
    s.setProperty('--ax', cfg.aX + '%');  s.setProperty('--ay', cfg.aY + '%');
    s.setProperty('--as', cfg.aS / 100);  s.setProperty('--rs', cfg.rS / 100);
    s.setProperty('--rbgc', DOA.hexA(cfg.rBg, cfg.rOp / 100));
    s.setProperty('--rac', cfg.rAc);      s.setProperty('--rflash', DOA.hexA(cfg.rAc, .35));
    s.setProperty('--rtx', cfg.rTx);
    s.setProperty('--rx', cfg.rX + '%');  s.setProperty('--ry', cfg.rY + '%');
    $('rTitle').textContent = '🏆 ' + cfg.rTitle;
    renderRank(); applyPin();
  }

  /* ---------- Ranking ---------- */
  function listaRank(){
    var arr = Object.keys(donors).map(function(k){ return donors[k]; })
      .sort(function(a,b){ return (b.total - a.total) || ((a.first || '') < (b.first || '') ? -1 : ((a.first || '') > (b.first || '') ? 1 : 0)); });
    if (!arr.length && preview && pinned) {
      arr = [{nome:'Maria',total:120},{nome:'João Pedro',total:120},{nome:'Ana Clara',total:50},
             {nome:'Tio Carlos',total:25},{nome:'Letícia',total:10},{nome:'Paulo Silva',total:8},
             {nome:'Bruna Costa',total:6},{nome:'Paulo Lima',total:5}];
    }
    return arr;
  }

  // Se a lista (por tamanho ou quantidade) passaria do rodapé, sobe o suficiente para caber na tela
  function fitRank(){
    var r = $('rank'), H = window.innerHeight, want = cfg.rY / 100 * H, max = H - r.offsetHeight - H * 0.01;
    r.style.top = (want > max) ? Math.max(0, max) + 'px' : '';
  }

  function renderRank(flashKey){
    var u = unit() * (cfg.rS / 100), rh = u * 2.9, gap = u * 0.5, list = $('rlist'), all = listaRank(), arr = all.slice(0, cfg.topn), keep = {};
    var cents = function(d){ return Math.round(d.total * 100); }, hasTie = false;
    // só conta empate no TOPO: pessoas com o mesmo total do 1º colocado (empates mais abaixo são ignorados)
    var topC = all.length ? cents(all[0]) : 0, nTop = all.filter(function(d){ return cents(d) === topC; }).length, tieTop = nTop > 1;
    arr = all.slice(0, Math.max(cfg.topn, tieTop ? nTop : 0));      // todos os empatados ficam sempre visíveis
    $('rank').style.opacity = arr.length ? 1 : 0;
    list.style.height = arr.length ? (arr.length * (rh + gap) - gap) + 'px' : '0px';
    arr.forEach(function(d, i){
      var k = key(d.nome); keep[k] = 1;
      var el = rows[k];
      if (!el) {
        el = document.createElement('div'); el.className = 'ri';
        el.innerHTML = '<span class="pos"></span><span class="nm"></span><span class="vs"></span><span class="vl"></span>';
        el.style.transform = 'translateY(' + (arr.length * (rh + gap)) + 'px)';
        el.style.opacity = '0';
        list.appendChild(el); rows[k] = el;
        void el.offsetWidth;
        el.style.opacity = '1';
      }
      el.style.height = rh + 'px';
      var empate = tieTop && cents(d) === topC; if (empate) hasTie = true;
      el.classList.toggle('tie', empate);
      el.querySelector('.vs').textContent = empate ? '⚔️' : '';
      el.querySelector('.pos').textContent = (empate ? 1 : i + 1) + 'º';   // empatados no topo dividem o 1º lugar
      el.querySelector('.nm').textContent = d.nome;
      el.querySelector('.vl').textContent = DOA.brl(d.total);
      el.style.transform = 'translateY(' + (i * (rh + gap)) + 'px)';
      if (k === flashKey) {
        el.classList.add('flash');
        setTimeout(function(){ el.classList.remove('flash'); }, 900);
      }
    });
    $('rank').classList.toggle('hastie', hasTie);
    $('rank').classList.toggle('round', !!cfg.rodada);
    fitRank();
    Object.keys(rows).forEach(function(k){
      if (!keep[k]) {
        var el = rows[k]; el.style.opacity = '0';
        setTimeout(function(){ el.remove(); }, 450);
        delete rows[k];
      }
    });
  }

  /* ---------- Som e faíscas ---------- */
  function chime(){
    if (!cfg.som) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      [660, 880, 1320].forEach(function(f, i){
        var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.12;
        o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.start(t); o.stop(t + 0.4);
      });
    } catch (e) {}
  }

  function sparks(){
    var cols = ['#ffb703', '#fb5607', '#3ddc97', '#ffffff'], W = window.innerWidth, H = window.innerHeight;
    for (var i = 0; i < 26; i++) {
      var s = document.createElement('div'); s.className = 'spark';
      s.style.left = (cfg.aX + 18) + '%'; s.style.top = (cfg.aY + 6) + '%';
      s.style.background = cols[i % cols.length];
      s.style.setProperty('--dx', ((Math.random() - .5) * W * .3) + 'px');
      s.style.setProperty('--dy', (Math.random() * H * .3) + 'px');
      document.body.appendChild(s);
      setTimeout((function(el){ return function(){ el.remove(); }; })(s), 1200);
    }
  }

  /* ---------- Alerta ---------- */
  function applyPin(){
    var a = $('alert');
    if (showing) return;
    if (pinned) {
      $('aWho').textContent = '💛 Nome da pessoa doou';
      $('aAmt').textContent = DOA.brl(25);
      $('aMsg').style.display = 'none';
      if (!a.classList.contains('in')) { a.className = 'alert'; void a.offsetWidth; a.className = 'alert in'; }
    } else if (a.classList.contains('in')) {
      a.className = 'alert';
    }
  }

  function next(){
    if (showing || !queue.length) return;
    showing = true;
    var d = queue.shift(), a = $('alert'), extra = d.tie ? ' tiealert' : '';
    if (d.tie) {                                           // aviso: empate no 1º lugar
      $('aWho').textContent = '⚔️ EMPATE NO 1º LUGAR!';
      $('aAmt').textContent = d.nomes.join(' x ');
      $('aMsg').textContent = DOA.brl(d.total) + ' cada';
      $('aMsg').style.display = 'block';
    } else {
      $('aWho').textContent = '💛 ' + d.nome + ' doou';
      $('aAmt').textContent = DOA.brl(d.valor);
      $('aMsg').textContent = d.msg || '';
      $('aMsg').style.display = d.msg ? 'block' : 'none';
    }
    a.className = 'alert'; void a.offsetWidth; a.className = 'alert' + extra + ' in';
    chime(); sparks();

    if (!d.tie) {
      var k = key(d.nome);
      rebuildDonors();                     // esta doação deixa de estar "na fila" e entra no ranking
      checkTie(true);                      // se ela provocou um empate no topo, avisa em seguida
      setTimeout(function(){ renderRank(k); }, 500);
    }

    setTimeout(function(){
      a.className = 'alert' + extra + ' out';
      setTimeout(function(){
        a.className = 'alert'; showing = false;
        if (queue.length) next(); else if (pinned) applyPin();
      }, 400);
    }, ((Number(cfg.dur) || 3) + (d.tie ? 2 : 0)) * 1000);
  }

  // Empate no TOPO da tabela (mesmo total do 1º lugar). Empates abaixo do topo não contam.
  var lastTieSig = '';
  function topTieInfo(){
    var arr = Object.keys(donors).map(function(k){ return donors[k]; }).sort(function(a, b){ return b.total - a.total; });
    if (arr.length < 2) return null;
    var c = Math.round(arr[0].total * 100);
    var grp = arr.filter(function(d){ return Math.round(d.total * 100) === c; });
    if (grp.length < 2) return null;
    grp.sort(function(a, b){ return (a.first || '') < (b.first || '') ? -1 : 1; });
    return { nomes: grp.map(function(d){ return d.nome; }), total: arr[0].total,
             sig: grp.map(function(d){ return key(d.nome); }).sort().join('|') + '@' + c };
  }
  function checkTie(announce){
    var t = topTieInfo();
    if (!t) { lastTieSig = ''; return; }
    if (t.sig !== lastTieSig) {
      lastTieSig = t.sig;
      if (announce) queue.push({ tie: true, id: 'tie', nomes: t.nomes, total: t.total });
    }
  }

  /* ---------- Conexão em tempo real com o Firebase ---------- */
  function aviso(txt){ var e = $('aviso'); e.textContent = txt || ''; e.style.display = txt ? 'block' : 'none'; }

  var locked = false;                // na prévia do painel, a aparência vem do painel, não do servidor
  var evMap = {}, known = {}, firstLoad = true, offTimer = null;

  // Ranking = soma por nome de todas as doações que já foram exibidas (as da fila ainda não contam)
  function rebuildDonors(){
    var pend = {}, tot = {};
    queue.forEach(function(q){ pend[q.id] = 1; });
    Object.keys(evMap).forEach(function(id){
      if (pend[id]) return;
      var e = evMap[id]; if (!e || !e.nome || !(Number(e.valor) > 0)) return;
      var k = key(e.nome);
      if (!tot[k]) tot[k] = { nome: String(e.nome), total: 0, first: id };
      else if (id < tot[k].first) tot[k].first = id;
      tot[k].total = Math.round((tot[k].total + Number(e.valor)) * 100) / 100;
    });
    donors = tot;
  }

  function onEvents(data){
    evMap = data || {};
    Object.keys(evMap).sort().forEach(function(id){       // ids do Firebase já vêm em ordem de envio
      if (known[id]) return;
      known[id] = 1;
      var e = evMap[id]; if (!e || !e.nome || !(Number(e.valor) > 0)) return;
      if (!firstLoad) queue.push({ id: id, nome: String(e.nome).slice(0, 30), valor: Number(e.valor), msg: String(e.msg || '').slice(0, 80) });
    });
    Object.keys(known).forEach(function(id){ if (!evMap[id]) delete known[id]; });   // desfeitas / zeradas
    queue = queue.filter(function(q){ return q.tie || evMap[q.id]; });
    var primeira = firstLoad;
    firstLoad = false;                                     // 1ª leitura = só carrega o ranking, sem alertas antigos
    rebuildDonors(); checkTie(!primeira); 
    if (!topTieInfo()) queue = queue.filter(function(q){ return !q.tie; });   // empate desfeito: descarta aviso pendente
    renderRank();
    next();
  }

  function status(ok){
    clearTimeout(offTimer);
    if (ok) aviso('');
    else offTimer = setTimeout(function(){ aviso('Sem conexão com o servidor de doações…'); }, 6000);
  }

  window.addEventListener('message', function(ev){
    if (!preview) return;
    var m = ev.data || {};
    if (m.type === 'cfg') { locked = true; applyCfg(m.cfg || {}); }
    else if (m.type === 'pin') { pinned = !!m.on; applyPin(); renderRank(); }
  });
  window.addEventListener('resize', function(){ renderRank(); });

  unit(); applyCfg({});
  if (!DOA.fbOk()) {
    aviso('Configure o Firebase no arquivo config.js');
  } else {
    DOA.stream('/cfg', function(c){ if (!locked) applyCfg(c || {}); });
    DOA.stream('/events', onEvents, status);
  }
})();
</script>
</body>
</html>
